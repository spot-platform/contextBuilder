# skill_to_tag.yaml — POI-anchored pipeline §Phase 0.
#
# 30 skill_topic × { primary_tags / secondary_tags / avoid_tags / role_hint }.
# place_normalized 의 9 boolean tags (is_food/is_cafe/is_activity/is_park/is_culture/
# is_nightlife/is_lesson/is_night_friendly/is_group_friendly) 을 후보 풀 필터로 사용.
#
# routing 알고리즘 의사:
#   1. primary_pool  = region 의 POI 중 primary_tags 하나라도 True
#   2. secondary_pool= region 의 POI 중 secondary_tags 하나라도 True
#   3. avoid_tags 하나라도 True 면 둘 다에서 배제
#   4. role 별로 role_hint 우선 태그가 있는 후보 → top_k → deterministic shuffle
#
# 모든 skill 은 __default__ + 30 skill 의 superset. yaml 검증으로 강제.

# ───────── 음악 / 악기 ─────────

기타:
  primary_tags: [is_cafe]
  secondary_tags: [is_culture, is_lesson]
  avoid_tags: [is_nightlife]
  role_hint:
    meetup: is_cafe
    main: is_cafe
    wrapup: is_cafe

